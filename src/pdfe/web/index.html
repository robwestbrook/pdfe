<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Editor</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <strong>PDF Editor</strong>
    <span id="file-name"></span>
    <span id="revision"></span>
    <label class="button">Open PDF <input type="file" id="open-file" accept="application/pdf" hidden></label>
    <button id="new-doc" type="button">New document</button>
    <a id="download" class="button" hidden>Download</a>
  </header>

  <div id="font-banner" class="banner" hidden></div>
  <div id="error" class="banner error" hidden></div>

  <nav id="page-strip" class="page-strip" aria-label="Pages"></nav>

  <div class="workspace">
    <main class="canvas-wrap">
      <canvas id="page-canvas"></canvas>
    </main>

    <aside id="tool-panel" class="tool-panel">
      <section>
        <h3>Text blocks</h3>
        <div id="text-blocks"></div>
      </section>
      <section>
        <h3>Images</h3>
        <div id="image-list"></div>
      </section>
      <section>
        <h3>Add to this page</h3>
        <button id="add-page" type="button">Add blank page</button>
        <form id="add-text-form">
          <textarea name="text" placeholder="New text" required></textarea>
          <div class="grid4">
            <input name="x0" type="number" value="72" aria-label="left">
            <input name="y0" type="number" value="72" aria-label="top">
            <input name="x1" type="number" value="300" aria-label="right">
            <input name="y1" type="number" value="120" aria-label="bottom">
          </div>
          <button type="submit">Add text box</button>
        </form>
        <form id="add-picture-form">
          <input name="file" type="file" accept="image/png" required>
          <div class="grid4">
            <input name="x0" type="number" value="72" aria-label="left">
            <input name="y0" type="number" value="150" aria-label="top">
            <input name="x1" type="number" value="200" aria-label="right">
            <input name="y1" type="number" value="300" aria-label="bottom">
          </div>
          <button type="submit">Add picture</button>
        </form>
      </section>
    </aside>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
