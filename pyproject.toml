[project]
name = "pdfe"
version = "0.1.0"
description = "A local web app for editing and creating PDFs"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "sqlalchemy",
    "pymupdf",
    "pypdf",
    "pillow",
    "wand>=0.7.2",
    "pikepdf>=10.17.0",
]

[project.scripts]
pdfe = "pdfe.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "playwright>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfe"]

[tool.pytest.ini_options]
filterwarnings = [
    # Starlette's test client reports that httpx is deprecated for it. That is the library's notice, not ours.
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]
