[project]
name = "pdfe"
version = "0.1.0"
description = "A local web app for editing and creating PDFs"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "sqlalchemy",
    "pymupdf",
    "pypdf",
    "pillow",
]

[project.scripts]
pdfe = "pdfe.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfe"]
